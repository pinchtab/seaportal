services:
  fixtures:
    image: nginx:alpine
    volumes:
      - ./fixtures:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:80/"]
      interval: 2s
      timeout: 5s
      retries: 5

  # Dedicated root for the multi-page scrape fixture (ALP-014): its sitemap and
  # robots.txt use absolute http://scrapesite/ URLs and must be served at the
  # host root, so it gets its own nginx serving ./fixtures/site.
  scrapesite:
    image: nginx:alpine
    volumes:
      - ./fixtures/site:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:80/robots.txt"]
      interval: 2s
      timeout: 5s
      retries: 5

  # No-sitemap variant (ALP-018): homepage + relative-linked pages, no
  # sitemap.xml, so scrape discovery must fall back to a bounded homepage crawl.
  crawlsite:
    image: nginx:alpine
    volumes:
      - ./fixtures/site-nosm:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:80/index.html"]
      interval: 2s
      timeout: 5s
      retries: 5

  # Dated sitemap variant (ALP-051/052 follow-up): its sitemap.xml carries
  # per-URL <lastmod> (future-dated "fresh" + ancient "stale" pages, so the
  # split is time-stable) to exercise `scrape --recent-days`.
  datedsite:
    image: nginx:alpine
    volumes:
      - ./fixtures/site-dated:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:80/robots.txt"]
      interval: 2s
      timeout: 5s
      retries: 5

  runner:
    build:
      context: ./runner
    depends_on:
      fixtures:
        condition: service_healthy
      scrapesite:
        condition: service_healthy
      crawlsite:
        condition: service_healthy
      datedsite:
        condition: service_healthy
    environment:
      - FIXTURES_URL=http://fixtures:80
      - SCRAPE_SITE_URL=http://scrapesite:80
      - CRAWL_SITE_URL=http://crawlsite:80
      - DATED_SITE_URL=http://datedsite:80
    volumes:
      - ./scenarios:/scenarios:ro
      - ./results:/results
    command: ["/scenarios/run-all.sh"]
