name: Reusable / Go

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download deps
        run: go mod download

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o seaportal ./cmd/seaportal

      - name: Test with coverage
        run: go test ./... -v -count=1 -race -coverprofile=coverage.out -covermode=atomic

      - name: Extraction regression check
        # Smoke-tagged fixture test that guards against extraction-quality
        # regressions on real-world page shapes (table-laid-out, link-dense,
        # JS-shell). Runs without -race to keep it fast; fixtures are committed
        # under testdata/fixtures.
        run: go test -tags=smoke -count=1 ./internal/engine/ -run TestFixture_NoRegression

      - name: Heavy extraction fixtures
        # The multi-MB real-world fixtures (wikipedia-latin, github-awesome) and
        # the full classifier corpus run ~20x slower under -race, so they skip
        # the race lane above (see skipHeavyFixture in testmain_test.go) and run
        # here without -race — same contracts, a fraction of the wall time.
        run: go test -count=1 ./internal/engine/ -run 'TestExtract_WikipediaLatinPhrases|TestBM25Quality_WikipediaLatinPhrases|TestClassifier_AccuracyOnCorpus|TestPreprocessBaseline_ExtractionMatrix'

      - name: Integration tests (MCP conformance)
        # `-tags=integration` gates the MCP JSON-RPC conformance suite and the
        # MCP cold-start budget. Runs in this non-race lane.
        run: go test -tags=integration ./cmd/seaportal/ -run 'TestMCP' -count=1 -timeout 600s

      - name: Latency budget (advisory)
        # FromURL latency budget (p95 ≤ 1.5s, p99 ≤ 2.5s) over the eval corpus.
        # Advisory: the p95 budget is currently exceeded by the multi-MB
        # multilingual fixtures (~1.55s on a dev laptop, and it had never run
        # in CI before being wired here) — recalibrating the envelope vs
        # optimizing the big-page path is an open product decision. Runs
        # without -race, which would skew wall time.
        continue-on-error: true
        run: |
          if ! go test -tags=integration ./internal/engine/ -run 'TestLatencyBudget' -count=1 -timeout 600s; then
            echo "::warning title=Latency budget exceeded::TestLatencyBudget is over the p95/p99 envelope. Recalibrate the budget or optimize the large-page extraction path."
            exit 1
          fi

      - name: Allocation budgets (advisory)
        # Compares B/op and allocs/op of the hot-path benchmarks against the
        # committed baseline (tests/bench/profiles/allocs_baseline.json, ±15%
        # tolerance). Advisory for now: continue-on-error keeps drift from
        # failing the job, but the warning annotation stays visible on the
        # run. Regenerate the baseline with scripts/regen-allocs-baseline.sh.
        continue-on-error: true
        run: |
          if ! go test -tags=allocs -run TestAllocationBudgets ./internal/engine/ -count=1; then
            echo "::warning title=Allocation budget drift::TestAllocationBudgets drifted beyond ±15% of tests/bench/profiles/allocs_baseline.json. If intentional, regenerate the baseline with scripts/regen-allocs-baseline.sh."
            exit 1
          fi

      - name: Coverage summary & floor
        # The floor lives in .github/coverage-floor.txt; raise it as coverage
        # improves. If a change legitimately lowers total coverage, lower the
        # floor in the same PR so the drop is explicit and reviewed.
        run: |
          coverage=$(go tool cover -func=coverage.out | tail -1)
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          total=$(echo "$coverage" | grep -Eo '[0-9]+\.[0-9]+%' | tr -d '%')
          floor=$(cat .github/coverage-floor.txt)
          echo "Total coverage: ${total}% (floor: ${floor}%)"
          if awk -v total="$total" -v floor="$floor" 'BEGIN { exit (total >= floor) ? 0 : 1 }'; then
            echo "Coverage is at or above the floor."
          else
            echo "::error title=Coverage below floor::Total coverage ${total}% is below the ${floor}% floor in .github/coverage-floor.txt."
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --timeout=5m

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.4

      - name: Run gosec
        run: gosec -exclude=G301,G302,G304,G306,G404,G107 -fmt=json -out=gosec-results.json ./... || true

      - name: Check critical findings
        run: |
          if [ -f gosec-results.json ]; then
            ISSUES=$(cat gosec-results.json | jq '[.Issues[] | select(.rule_id == "G112" or .rule_id == "G204")] | length')
            echo "Critical issues: $ISSUES"
            if [ "$ISSUES" -gt 0 ]; then
              cat gosec-results.json | jq '.Issues[] | select(.rule_id == "G112" or .rule_id == "G204")'
              exit 1
            fi
          fi
